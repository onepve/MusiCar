name: Build & Release CarMedia APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CarMedia.apk
          echo "APK_PATH=output/CarMedia.apk" >> $GITHUB_ENV
          ls -la output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarMedia-APK
          path: output/CarMedia.apk
          retention-days: 1

      - name: Publish Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" output/CarMedia.apk \
            --title "CarMedia 车机媒体 $TAG" \
            --notes "CarMedia 车机媒体 (蓝牙音乐) $TAG 源码构建产物" \
            -R onepve/MusiCar

      - name: Cleanup GitHub Action Caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install actions/gh-actions-cache 2>/dev/null || true
          gh actions-cache list -R "onepve/MusiCar" -L 100 --order desc | cut -f 1 | while read -r key; do
            gh actions-cache delete "$key" -R "onepve/MusiCar" --confirm 2>/dev/null || true
          done
